services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: pedestriroute_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedestriroute
      POSTGRES_USER: pedestriroute
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pedestriroute_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedestriroute -d pedestriroute"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ../
      dockerfile: infra/docker/php/Dockerfile
    container_name: pedestriroute_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ../backend:/var/www/backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: pedestriroute
      DB_USERNAME: pedestriroute
      DB_PASSWORD: secretpassword
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: pedestriroute_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  cv-service:
    build:
      context: ../cv-service
      dockerfile: Dockerfile
    container_name: pedestriroute_cv
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - CV_MOCK=false
      - CV_MODEL_PATH=/app/models/pedestriroute_classifier.onnx
    volumes:
      - ../cv-service:/app

  queue:
    build:
      context: ../
      dockerfile: infra/docker/php/Dockerfile
    container_name: pedestriroute_queue
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=30
    volumes:
      - ../backend:/var/www/backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: pedestriroute
      DB_USERNAME: pedestriroute
      DB_PASSWORD: secretpassword
    depends_on:
      db:
        condition: service_healthy
      cv-service:
        condition: service_started

  reverb:
    build:
      context: ../
      dockerfile: infra/docker/php/Dockerfile
    container_name: pedestriroute_reverb
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../backend:/var/www/backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: pedestriroute
      DB_USERNAME: pedestriroute
      DB_PASSWORD: secretpassword
    depends_on:
      db:
        condition: service_healthy
        
volumes:
  pedestriroute_pgdata:
