services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: pedestriroute_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedestriroute
      POSTGRES_USER: pedestriroute
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - pedestriroute_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedestriroute -d pedestriroute"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ../
      dockerfile: infra/docker/php/Dockerfile
    container_name: pedestriroute_app
    restart: unless-stopped
    working_dir: /var/www/backend
    environment:
      APP_NAME: PedestriRoute
      APP_ENV: production
      APP_KEY: base64:LKjIoqxAoTOUwBNfr7JeVn4d4FRPCe7zMAFrZ49y8IA=
      APP_DEBUG: "false"
      APP_URL: https://pedestri-route.caiis.ai.id
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: pedestriroute
      DB_USERNAME: pedestriroute
      DB_PASSWORD: secretpassword
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: public
      CFG_CV_ENABLED: "true"
      CFG_CV_THRESHOLD: "0.80"
      CV_SERVICE_URL: http://cv-service:8000
      GOOGLE_OAUTH_MOCK: "false"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "https://pedestri-route.caiis.ai.id/api/v1/auth/google/callback"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      GOOGLE_MAPS_TYPE: "${GOOGLE_MAPS_TYPE:-roadmap}"
      FACEBOOK_OAUTH_MOCK: "true"
    volumes:
      - pedestriroute_storage:/var/www/backend/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      cv-service:
        condition: service_healthy

  nginx:
    build:
      context: ../
      dockerfile: infra/docker/nginx/Dockerfile
    container_name: pedestriroute_nginx
    restart: unless-stopped
    depends_on:
      - app

  cv-service:
    build:
      context: ../cv-service
      dockerfile: Dockerfile
    container_name: pedestriroute_cv
    restart: unless-stopped
    environment:
      - CV_MOCK=${CV_MOCK:-false}
      - CV_MODEL_PATH=/app/models/pedestriroute_classifier.onnx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json, sys; d = json.load(urllib.request.urlopen('http://localhost:8000/health')); sys.exit(0 if d.get('model_ready') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  queue:
    build:
      context: ../
      dockerfile: infra/docker/php/Dockerfile
    container_name: pedestriroute_queue
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=30
    environment:
      APP_NAME: PedestriRoute
      APP_ENV: production
      APP_KEY: base64:LKjIoqxAoTOUwBNfr7JeVn4d4FRPCe7zMAFrZ49y8IA=
      APP_DEBUG: "false"
      APP_URL: https://pedestri-route.caiis.ai.id
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: pedestriroute
      DB_USERNAME: pedestriroute
      DB_PASSWORD: secretpassword
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: public
      CFG_CV_ENABLED: "true"
      CFG_CV_THRESHOLD: "0.80"
      CV_SERVICE_URL: http://cv-service:8000
      GOOGLE_OAUTH_MOCK: "false"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "https://pedestri-route.caiis.ai.id/api/v1/auth/google/callback"
      FACEBOOK_OAUTH_MOCK: "true"
    volumes:
      - pedestriroute_storage:/var/www/backend/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      cv-service:
        condition: service_healthy

  reverb:
    build:
      context: ../
      dockerfile: infra/docker/php/Dockerfile
    container_name: pedestriroute_reverb
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_NAME: PedestriRoute
      APP_ENV: production
      APP_KEY: base64:LKjIoqxAoTOUwBNfr7JeVn4d4FRPCe7zMAFrZ49y8IA=
      APP_DEBUG: "false"
      APP_URL: https://pedestri-route.caiis.ai.id
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: pedestriroute
      DB_USERNAME: pedestriroute
      DB_PASSWORD: secretpassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  pedestriroute_pgdata:
  pedestriroute_storage:
